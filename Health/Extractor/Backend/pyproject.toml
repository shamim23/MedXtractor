[project]
name = "transcript_crew"
version = "0.1.0"
description = "CrewAI-powered transcript analysis system"
authors = [{name = "Your Name", email = "you@example.com"}]
requires-python = ">=3.10"
dependencies = [
    "crewai[tools]>=0.100.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "openai-whisper>=20231117",
    "youtube-transcript-api>=0.6.2",
    "yt-dlp>=2023.12.30",
]

[project.scripts]
transcript_crew = "transcript_crew.main:run"

[tool.crewai]
type = "crew"
